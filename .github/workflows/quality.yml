name: Service quality
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: service-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: websites
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
          cache: npm
          cache-dependency-path: websites/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx astro check
      - run: npm test
      - run: npm audit --audit-level=moderate
      - run: npm run build
